name: mimamori

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mimamori}
      MYSQL_USER: ${MYSQL_USER:-mimamori}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-13317}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-16333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  ai:
    build:
      context: ../ai
    restart: unless-stopped
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-18000}:8000"
    depends_on:
      - qdrant

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mimamori}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mimamori}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET of at least 32 bytes}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_INTERNAL_TOKEN: ${RAG_INTERNAL_TOKEN:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
