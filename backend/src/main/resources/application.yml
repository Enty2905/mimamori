spring:
  application:
    name: mimamori-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/mimamori?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:mimamori}
    password: ${SPRING_DATASOURCE_PASSWORD:mimamori_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  quartz:
    job-store-type: memory
    auto-startup: true
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-key}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.groq.com/openai/v1}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:llama-3.3-70b-versatile}

mimamori:
  jwt:
    secret: ${JWT_SECRET:mimamori-super-secret-key-for-jwt-tokens-graduation-project-2026-secure-at-least-256-bits!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  groq:
    api-key: ${GROQ_API_KEY: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}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-20b}

server:
  port: ${SERVER_PORT:8080}
