[project]
name = "mimamori-ai"
version = "0.1.0"
description = "Internal RAG service for Mimamori AI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "filelock",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "sentence-transformers",
    "torch==2.13.0",
    "uvicorn[standard]",
]

# Keep Linux/Docker inference CPU-only; Windows/macOS PyPI wheels are CPU builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires an explicitly configured real Qdrant server",
    "model: downloads/loads the pinned real multilingual embedding model",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
